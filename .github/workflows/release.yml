name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Install RPM packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes rpm

      - name: Build release packages
        shell: bash
        run: |
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a version tag such as v1.2.3; received $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          ./gradlew --no-daemon "-PreleaseVersion=$RELEASE_VERSION" \
            :cli:packageCli \
            :wstool-import:packageMavenWstoolImport \
            :wstool-import:packageWstoolNpmImport \
            :wstool-gradle-plugin:packageGradle \
            :wstool-gradle-plugin:packageWstoolGradle \
            :cli:packageDeb \
            :cli:packageRpm

      - name: Create release checksums
        run: |
          sha256sum \
            "cli/build/distributions/wstool-cli-${RELEASE_VERSION}.zip" \
            "cli/build/distributions/wstool_${RELEASE_VERSION}-1_amd64.deb" \
            "cli/build/distributions/wstool-${RELEASE_VERSION}-1.x86_64.rpm" \
            wstool-import/build/distributions/maven-wstool-import-1.0.0.zip \
            wstool-import/build/distributions/wstool-npm-import-1.0.0.zip \
            wstool-gradle-plugin/build/distributions/gradle-*.zip \
            wstool-gradle-plugin/build/distributions/wstool-gradle-1.0.0.zip \
            > SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: wstool ${{ env.RELEASE_VERSION }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            cli/build/distributions/wstool-cli-${{ env.RELEASE_VERSION }}.zip
            cli/build/distributions/wstool_${{ env.RELEASE_VERSION }}-1_amd64.deb
            cli/build/distributions/wstool-${{ env.RELEASE_VERSION }}-1.x86_64.rpm
            wstool-import/build/distributions/maven-wstool-import-1.0.0.zip
            wstool-import/build/distributions/maven-wstool-import-1.0.0.zip.sha256
            wstool-import/build/distributions/wstool-npm-import-1.0.0.zip
            wstool-import/build/distributions/wstool-npm-import-1.0.0.zip.sha256
            wstool-gradle-plugin/build/distributions/gradle-*.zip
            wstool-gradle-plugin/build/distributions/gradle-*.zip.sha256
            wstool-gradle-plugin/build/distributions/wstool-gradle-1.0.0.zip
            wstool-gradle-plugin/build/distributions/wstool-gradle-1.0.0.zip.sha256
            SHA256SUMS
