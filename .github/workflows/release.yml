name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Install RPM packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes rpm

      - name: Build release packages
        shell: bash
        run: |
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a version tag such as v1.2.3; received $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          ./gradlew --no-daemon "-PreleaseVersion=$RELEASE_VERSION" \
            :wstool-npm-import:packageNpmWstool \
            :wstool-npm-import:packageWstoolNpmImport \
            :wstool-maven-import:packageWstoolMavenImport

      - name: Create release checksums
        run: |
          sha256sum \
            wstool-npm-import/build/distributions/npm-wstool-1.0.0.tar.gz \
            wstool-npm-import/build/distributions/wstool-npm-import-1.0.0.tar.gz \
            wstool-maven-import/build/distributions/wstool-maven-import-1.0.0.tar.gz \
            > SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: wstool ${{ env.RELEASE_VERSION }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            wstool-npm-import/build/distributions/npm-wstool-1.0.0.tar.gz
            wstool-npm-import/build/distributions/wstool-npm-import-1.0.0.tar.gz
            wstool-maven-import/build/distributions/wstool-maven-import-1.0.0.tar.gz
            SHA256SUMS
