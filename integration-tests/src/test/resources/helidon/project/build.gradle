plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'io.helidon.webserver:helidon-webserver:4.5.4'
}

application {
    mainClass = 'example.helidon.Main'
}

buildDir = file("${System.getenv('WST_PREFIX')}/gradle-build")

tasks.named('installDist') {
    destinationDir = file("${System.getenv('WST_PREFIX')}/gradle-build/install")
}

tasks.named('build') {
    dependsOn tasks.named('installDist')
}
